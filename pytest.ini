[pytest]
# Pytest configuration for pyMut project
# NOTE: the section header MUST be [pytest] in a pytest.ini file. The previous
# header ([tool:pytest]) is only valid in pyproject.toml / setup.cfg and made
# pytest silently ignore this whole configuration.

# Test discovery and collection
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and verbosity - Clean and professional output
addopts =
    -W ignore::DeprecationWarning
    -W ignore::UserWarning
    -W ignore::PendingDeprecationWarning
    -W ignore::FutureWarning
    -W ignore::RuntimeWarning
    --tb=short
    --strict-markers
    --maxfail=5
    -k "not test_oncoplot"
    -q

# Warning filters - comprehensive suppression for clean output
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::RuntimeWarning
    ignore:.*find_common_type.*:DeprecationWarning
    ignore:.*promote_types.*:DeprecationWarning
    ignore:.*result_type.*:DeprecationWarning

# Minimum version requirements
minversion = 6.0

# Test timeout (requires the pytest-timeout plugin; harmless warning otherwise)
timeout = 300

# Markers for test organization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
